- name: Install packages based on loop map play
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: Instll or remove based on loop map
    ansible.builtin.package:
      name: "{{ item.name }}"
      state: "{{ item.state }}"
    loop:
    - {name: "nginx", state: "present"}
    - {name: "zip", state: "absent"}
    - {name: "mysql", state: "present"}
    - {name: "tree", state: "absent"}