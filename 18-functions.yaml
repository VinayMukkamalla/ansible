- name: functions
  hosts: local
  connection: local
  vars:
    name: defining variable here  # eventhough name is a reserved keyword in ansible I am using it to practice
    technologies: Devops, linux, shell, ansible #string
    #dictionary == map
    Tags:
      Application: payment
      Environment: dev
    ListTags:
    - key: Application
      value: payment
    - key: Environment
      value: dev 
  tasks:
  - name: default variable
    ansible.builtin.debug:
#      msg: "Hello {{ name }}"   --> undefined variable
       msg: "Hello {{ name | default(' providing default Value for variable name if it is not defined')}}"

  # string to list
  - name: convert string to list
    ansible.builtin.debug:
      msg: "Technologies are : {{ technologies | split(',') }}"
  
  # map to list
  - name: convert map to list
    ansible.builtin.debug:
      msg: " Tags are : {{ Tags | dict2items }} "  # dict(dictionary or map ) 2 to items(list)

  # list to map or dict
  - name: convert list to map
    ansible.builtin.debug:
      msg: "ListTags are {{ ListTags | items2dict}}"

